<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>{% if page.title and page.title != site.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip | escape }}">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content · 跳到正文</a>
  <header class="site-header">
    <nav class="site-nav" aria-label="Site">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <ul>
        <li><a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy · 隐私</a></li>
        <li><a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support · 支持</a></li>
      </ul>
    </nav>
  </header>
  <main id="content">
{{ content }}
  </main>
  <footer class="site-footer">
    <p>
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a> ·
      <a href="{{ '/privacy/' | relative_url }}">Privacy Policy · 隐私政策</a> ·
      <a href="{{ '/support/' | relative_url }}">Support · 支持</a>
    </p>
    <p>These pages set no cookies and load nothing from other servers. · 本站不设 cookie，不从其他服务器加载任何内容。</p>
  </footer>
</body>
</html>
